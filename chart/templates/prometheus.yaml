apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flights.fullname" . }}-prometheus-config
  labels:
    {{- include "flights.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: flights-api
        static_configs:
          - targets: ["{{ include "flights.fullname" . }}-api:80"]
            labels:
              service: flights-api
      - job_name: flights-notification-worker
        static_configs:
          - targets: ["{{ include "flights.fullname" . }}-notification-worker:{{ .Values.notificationWorker.metricsPort }}"]
            labels:
              service: notification-worker
      - job_name: flights-analytics-worker
        static_configs:
          - targets: ["{{ include "flights.fullname" . }}-analytics-worker:{{ .Values.analyticsWorker.metricsPort }}"]
            labels:
              service: analytics-worker
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flights.fullname" . }}-prometheus
  labels:
    {{- include "flights.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.prometheus.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flights.fullname" . }}-prometheus
  labels:
    {{- include "flights.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: prometheus
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: prometheus
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - name: http
              containerPort: {{ .Values.prometheus.port }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "flights.fullname" . }}-prometheus-config
        - name: data
          emptyDir: {}