apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flights.fullname" . }}-notification-worker
  labels:
    {{- include "flights.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification-worker
spec:
  replicas: {{ .Values.notificationWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: notification-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: notification-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres and rabbitmq..."
              until nc -z {{ include "flights.fullname" . }}-postgres {{ .Values.postgres.port }}; do sleep 2; done
              echo "  postgres is up"
              until nc -z {{ include "flights.fullname" . }}-rabbitmq {{ .Values.rabbitmq.port }}; do sleep 2; done
              echo "  rabbitmq is up"
              echo "All dependencies ready."
      containers:
        - name: worker
          image: "{{ .Values.notificationWorker.image.repository }}:{{ .Values.notificationWorker.image.tag }}"
          imagePullPolicy: {{ .Values.notificationWorker.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.notificationWorker.metricsPort }}
          envFrom:
            - configMapRef:
                name: {{ include "flights.fullname" . }}-notification-worker
          resources:
            {{- toYaml .Values.notificationWorker.resources | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3