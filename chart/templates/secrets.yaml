apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flights.fullname" . }}-postgres
  labels:
    {{- include "flights.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flights.fullname" . }}-rabbitmq
  labels:
    {{- include "flights.labels" . | nindent 4 }}
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: {{ .Values.secrets.rabbitmqUser | quote }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.secrets.rabbitmqPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flights.fullname" . }}-grafana
  labels:
    {{- include "flights.labels" . | nindent 4 }}
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: {{ .Values.grafana.adminUser | quote }}
  GF_SECURITY_ADMIN_PASSWORD: {{ .Values.secrets.grafanaAdminPassword | quote }}