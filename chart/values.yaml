# Default values for Flights Platform.
# Override with values-dev.yaml, values-prod.yaml, or --set.

global:
  namespace: flights-platform

# ---- Application services ----

api:
  image:
    repository: flights-api
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    ASPNETCORE_ENVIRONMENT: Development

notificationWorker:
  image:
    repository: flights-notification-worker
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  metricsPort: 9101
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPU: 70

analyticsWorker:
  image:
    repository: flights-analytics-worker
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  metricsPort: 9102
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPU: 70

# ---- Stateful services ----

postgres:
  image:
    repository: postgres
    tag: 16-alpine
  storage: 5Gi
  user: flights
  database: flights_demo
  port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

redis:
  image:
    repository: redis
    tag: 7-alpine
  storage: 1Gi
  port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

rabbitmq:
  image:
    repository: rabbitmq
    tag: 3.13-management-alpine
  storage: 2Gi
  port: 5672
  managementPort: 15672
  user: guest
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# ---- Observability stack ----

jaeger:
  image:
    repository: jaegertracing/all-in-one
    tag: 1.76.0
  uiPort: 16686
  otlpGrpcPort: 4317
  otlpHttpPort: 4318
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  image:
    repository: prom/prometheus
    tag: v2.54.1
  port: 9090
  storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

grafana:
  image:
    repository: grafana/grafana
    tag: 11.3.0
  port: 3000
  adminUser: admin
  storage: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

# ---- Ingress ----

ingress:
  enabled: true
  className: nginx
  hosts:
    api: api.flights.local
    grafana: grafana.flights.local
    jaeger: jaeger.flights.local
    rabbit: rabbit.flights.local
    prometheus: prometheus.flights.local

# ---- Secrets (override in prod) ----
# Values here are DEFAULTS for local dev only.
# In prod: pass --set secrets.postgresPassword=xxx OR use External Secrets.

secrets:
  postgresPassword: flights_dev_password
  rabbitmqUser: guest
  rabbitmqPassword: guest
  grafanaAdminPassword: admin