# Dev overrides - matches docker-compose defaults.
# Used with: helm install flights ./chart -f chart/values-dev.yaml

global:
  namespace: flights-platform

api:
  replicas: 1
  env:
    ASPNETCORE_ENVIRONMENT: Development

notificationWorker:
  replicas: 1

analyticsWorker:
  replicas: 1

postgres:
  storage: 2Gi

redis:
  storage: 512Mi

rabbitmq:
  storage: 1Gi

prometheus:
  storage: 2Gi

grafana:
  storage: 512Mi

ingress:
  enabled: true
flightCatalog:
  image:
    repository: flights-flight-catalog
    tag: latest
  replicaCount: 1
  service:
    port: 80
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
