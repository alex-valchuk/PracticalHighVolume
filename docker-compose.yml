services:
  postgres:
    image: postgres:16-alpine
    container_name: flights-postgres
    environment:
      POSTGRES_USER: flights
      POSTGRES_PASSWORD: flights_dev_password
      POSTGRES_DB: flights_demo
      # Важно: search_path по умолчанию — bookings, public
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      #- ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flights -d flights_demo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata: