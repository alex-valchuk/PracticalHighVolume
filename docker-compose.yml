services:
  postgres:
    image: postgres:16-alpine
    container_name: flights-postgres
    environment:
      POSTGRES_USER: flights
      POSTGRES_PASSWORD: flights_dev_password
      POSTGRES_DB: flights_demo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flights -d flights_demo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flights-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: flights-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  notification-worker:
    build:
      context: .
      dockerfile: src/Workers/FlightsPlatform.NotificationWorker/Dockerfile
    image: flights-notification-worker:latest
    container_name: flights-notification-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Notification: "Host=flights-postgres;Port=5432;Database=flights_demo;Username=flights;Password=flights_dev_password"
      RabbitMq__Host: "flights-rabbitmq"
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  analytics-worker:
    build:
      context: .
      dockerfile: src/Workers/FlightsPlatform.AnalyticsWorker/Dockerfile
    image: flights-analytics-worker:latest
    container_name: flights-analytics-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Analytics: "Host=flights-postgres;Port=5432;Database=flights_demo;Username=flights;Password=flights_dev_password"
      RabbitMq__Host: "flights-rabbitmq"
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

volumes:
  pgdata:
  redisdata:
  rabbitmqdata: