services:
  postgres:
    image: postgres:16-alpine
    container_name: flights-postgres
    environment:
      POSTGRES_USER: flights
      POSTGRES_PASSWORD: flights_dev_password
      POSTGRES_DB: flights_demo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flights -d flights_demo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flights-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: flights-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: flights-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: flights-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: flights-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

  notification-worker:
    build:
      context: .
      dockerfile: src/Workers/FlightsPlatform.NotificationWorker/Dockerfile
    image: flights-notification-worker:latest
    container_name: flights-notification-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Notification: "Host=flights-postgres;Port=5432;Database=flights_demo;Username=flights;Password=flights_dev_password"
      RabbitMq__Host: "flights-rabbitmq"
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      Observability__ServiceName: "FlightsPlatform.NotificationWorker"
      Observability__OtlpEndpoint: "http://flights-jaeger:4317"
      Observability__TraceSamplingRatio: "1.0"
      Observability__MetricsPort: "9101"
    ports:
      - "9101:9101"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  analytics-worker:
    build:
      context: .
      dockerfile: src/Workers/FlightsPlatform.AnalyticsWorker/Dockerfile
    image: flights-analytics-worker:latest
    container_name: flights-analytics-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Analytics: "Host=flights-postgres;Port=5432;Database=flights_demo;Username=flights;Password=flights_dev_password"
      RabbitMq__Host: "flights-rabbitmq"
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      Observability__ServiceName: "FlightsPlatform.AnalyticsWorker"
      Observability__OtlpEndpoint: "http://flights-jaeger:4317"
      Observability__TraceSamplingRatio: "1.0"
      Observability__MetricsPort: "9102"
    ports:
      - "9102:9102"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  prometheusdata:
  grafanadata: